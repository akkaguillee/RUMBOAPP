let CH=null,hf='all',meSeen=false,CA=0;
const lg=(c,d,l)=>`<img class="${c} ld" src="${IMG[d]}" alt="RUMBO"><img class="${c} ll" src="${IMG[l]}" alt="" aria-hidden="true">`;
const WM=lg('wm','wd','wl'),CL=lg('lgc','cd','cl');
const TG=()=>`<div class="tgw"><button class="cpk" data-act="accent" aria-label="Cambiar el color de la app"><i></i></button><button class="tg" data-act="theme" aria-label="Cambiar entre modo claro y oscuro"><i></i><span class="sun">${svg('sun',18)}</span><span class="moon">${svg('moon',18)}</span></button></div>`;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('rumbo.theme',t)}catch(e){}const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',t==='light'?'#ffffff':'#000000')}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){meSeen=true;x.target.classList.add('vis');io.unobserve(x.target)}}),{threshold:.15});
const ioc=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('go');ioc.unobserve(x.target)}}),{threshold:.35});
const $=s=>document.querySelector(s),KEY='weightly.v1';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){if(Date.now()-(store.t||0)>2e4){store.t=Date.now();typeof toast==='function'&&toast('No se pudo guardar: almacenamiento lleno o bloqueado. Exporta una copia.')}return false}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const blank=()=>({v:3,user:null,weights:[],water:{},steps:{},ex:[],goals:{water:2500,steps:10000,ex:30},demo:false});
function migrate(d){if(!d||typeof d!=='object'||Array.isArray(d))return null;const b=blank();for(const k of['water','steps','goals'])if(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k]))d[k]=b[k];d.goals=Object.assign({},b.goals,d.goals);for(const k of['weights','ex','tr','plan'])if(!Array.isArray(d[k]))d[k]=[];d.weights=d.weights.filter(x=>x&&typeof x.date==='string'&&Number.isFinite(+x.kg));d.ex=d.ex.filter(x=>x&&typeof x.date==='string'&&Number.isFinite(+x.min));d.v=3;return d}
let S=migrate(store.load())||blank(),tab='home',range=30,calSel,calM=new Date(),ob={step:0,d:{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(n,d=1)=>(+n).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const lab=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const num=(v,a,b)=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)&&v>=a&&v<=b?v:null};
const okDate=d=>/^\d{4}-\d\d-\d\d$/.test(d)&&!isNaN(new Date(d))&&d<=today();
const uid=()=>Math.random().toString(36).slice(2,9);
calSel=today();
// ---- cálculos ----
const ACT={1.2:'Sedentario',1.375:'Ligero',1.55:'Moderado',1.725:'Muy activo'};
const W=()=>S.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
const bmi=(kg,cm)=>kg/((cm/100)**2);
const bmiCat=b=>b<18.5?['Bajo peso','warn']:b<25?['Rango saludable','ok']:b<30?['Sobrepeso','warn']:['Obesidad','bad'];
const bmr=(u,kg)=>10*kg+6.25*u.cm-5*u.age+(u.sex==='m'?5:-161);
const tdee=(u,kg)=>bmr(u,kg)*u.act;
const target=(u,kg)=>{const t=tdee(u,kg);return Math.round(Math.max(u.sex==='m'?1500:1200,u.goal==='lose'?t*.8:u.goal==='gain'?t*1.1:t))};
const cur=()=>W().at(-1).kg;
function prog(){const c=cur(),u=S.user,tot=u.start-u.target,mv=u.goal==='gain'?c-u.start:u.start-c;
 return{c,mv:Math.max(0,mv),left:u.goal==='lose'?Math.max(0,c-u.target):u.goal==='gain'?Math.max(0,u.target-c):Math.abs(c-u.target),pct:tot?Math.max(0,Math.min(1,(u.start-c)/tot)):1}}
function status(){const w=W().filter(x=>x.date>=addD(today(),-21));
 if(w.length<2)return['ok','Buen comienzo. Registra unos días más y verás tu tendencia.'];
 const a=w[0],b=w.at(-1),wk=(b.kg-a.kg)/Math.max(1,(new Date(b.date)-new Date(a.date))/864e5)*7,g=S.user.goal;
 const s=g==='lose'?-wk:g==='gain'?wk:.3-Math.abs(wk);
 return s>=.2?['ok','Vas muy bien. Estás siguiendo tu objetivo.']:s>-.1?['warn','Tu progreso se ha ralentizado un poco. Los pequeños ajustes suman.']:['bad','Tu tendencia se está alejando del objetivo. Un buen día puede cambiarlo.']}
const chg=n=>{const w=W();if(w.length<2)return null;const ref=w.filter(x=>x.date<=addD(today(),-n)).at(-1)||w[0];return w.at(-1).kg-ref.kg};
const dl=v=>{if(v==null)return'<b>—</b>';const g=S.user.goal,good=g==='gain'?v>0:g==='lose'?v<0:Math.abs(v)<.3;return`<b class="${Math.abs(v)<.05?'':good?'ok':'bad'}">${v>0?'+':''}${f(v)} kg</b>`};
const exMin=d=>S.ex.filter(x=>x.date===d).reduce((a,x)=>a+x.min,0);
const hasW=d=>S.weights.some(x=>x.date===d);
const ratios=d=>({w:hasW(d)?1:0,water:Math.min(1,(S.water[d]||0)/S.goals.water),steps:Math.min(1,(S.steps[d]||0)/S.goals.steps),ex:Math.min(1,exMin(d)/S.goals.ex)});
const score=d=>{const r=Object.values(ratios(d));return Math.round(r.reduce((a,b)=>a+b)/r.length*100)};
const col=p=>p>=1?'ok':p>=.5?'warn':'bad';
const any=d=>hasW(d)||S.water[d]||S.steps[d]||exMin(d);

function chart(pts,goal){CH=null;
 if(pts.length<2)return'<p class="mut" style="padding:28px 0;text-align:center">Aún no hay suficientes registros en este periodo.<br>Añade tu peso para ver la evolución.</p>';

 const x0=xs[0],x1=xs.at(-1),a=Math.min(...ys)-.8,b=Math.max(...ys)+.8,X=v=>L+(v-x0)/((x1-x0)||1)*(Wd-L-R),Y=v=>T+(b-v)/((b-a)||1)*(H-T-B);
 const d=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
 let ln=0;const cm=pts.map((p,i)=>i?ln+=Math.hypot(X(xs[i])-X(xs[i-1]),Y(p.y)-Y(pts[i-1].y)):0),dr=CA?' draw':'';
 CH={pts,fx:xs.map(v=>X(v)/Wd),fy:pts.map(p=>Y(p.y)),Wd};return`<div class="chw"><svg class="ch${dr}" role="img" aria-label="Gráfica de la evolución del peso" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Gráfica de evolución del peso"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a-d,#e5293e)" stop-opacity=".25"/><stop offset="1" style="stop-color:var(--a-d,#e5293e)" stop-opacity="0"/></linearGradient></defs>
${[0,.5,1].map(t=>{const y=T+t*(H-T-B);return`<line x1="${L}" x2="${Wd-R}" y1="${y}" y2="${y}" stroke="var(--fill)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${f(b-t*(b-a))}</text>`}).join('')}
${goal!=null?`<line class="gl" x1="${L}" x2="${Wd-R}" y1="${Y(goal)}" y2="${Y(goal)}"/>`:''}
<path class="ar" d="${d}L${X(x1)} ${H-B}L${X(x0)} ${H-B}Z" fill="url(#g)"/><path class="ln" style="--a:${(ln+4).toFixed(1)};--b:${(ln*2+20).toFixed(1)};--o:${(ln+7).toFixed(1)}" d="${d}"/>
${pts.length<=40?pts.map((p,i)=>`<circle class="pt" style="--d:${(cm[i]/(ln||1)*1.7).toFixed(2)}s" cx="${X(xs[i])}" cy="${Y(p.y)}" r="3.5" fill="var(--bg)" stroke="var(--brand)" stroke-width="2"><title>${lab(p.x)}: ${f(p.y)} kg</title></circle>`).join(''):''}
<text x="${L}" y="${H-6}">${lab(pts[0].x)}</text><text x="${Wd-R}" y="${H-6}" text-anchor="end">${lab(pts.at(-1).x)}</text><line id="cl" class="cl" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><circle id="cd" class="cd" r="6" style="display:none"/></svg><div class="tip" id="tip" hidden></div></div>${goal!=null?`<p class="mut lgd"><i></i><span>Objetivo <b>${f(goal)} kg</b></span></p>`:''}<p class="mut hint">Pasa el cursor o desliza el dedo por la línea para ver cómo fue cada día.</p>`}

/* Capa añadida: repulsión líquida de orbes/partículas + feedback al registrar datos.

(()=>{try{
